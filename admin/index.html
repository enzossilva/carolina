<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Carolina Cristine</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin/admin.css?v=3">
</head>
<body class="admin-body" data-page="admin">
    <header>
        <nav class="navbar">
            <ul>
                <li class="carolina">
                    <a href="/">CAROLINA</a>
                    <span class="admin-tag">admin</span>
                </li>
                <li id="logout-wrap">
                    <button type="button" class="admin-nav-btn" id="logout">Sair</button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="admin-main">
        <section id="login-view" class="screen login-screen is-on">
            <form id="login-form">
                <h1>Entrar</h1>
                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Entrar</button>
                <p class="admin-error" id="login-error"></p>
            </form>
        </section>

        <section id="list-view" class="screen">
            <div class="admin-toolbar">
                <h1>Ensaios</h1>
                <button type="button" id="new-essay">Novo ensaio</button>
            </div>
            <div id="essay-list" class="gallery admin-gallery"></div>
        </section>

        <section id="edit-view" class="screen edit-screen">
            <div class="edit-top">
                <button type="button" class="admin-nav-btn" id="back-list">Voltar</button>
                <h1 id="edit-title">Ensaio</h1>
            </div>
            <div class="field">
                <label for="essay-name">Título</label>
                <input id="essay-name" type="text" maxlength="120">
            </div>
            <div class="admin-checks">
                <label><input type="checkbox" id="on-home"> Mostrar na home</label>
                <label><input type="checkbox" id="on-work"> Mostrar no WORK</label>
            </div>
            <label class="file-btn">
                Adicionar fotos
                <input id="photo-input" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" multiple>
            </label>
            <div id="photo-grid" class="photo-grid"></div>
            <p class="admin-status" id="edit-status"></p>
            <p class="admin-error" id="edit-error"></p>
            <div class="admin-actions">
                <button type="button" id="save-essay">Salvar e publicar</button>
                <button type="button" class="danger" id="delete-essay">Excluir ensaio</button>
            </div>
        </section>
    </main>
    <script src="/admin/config.js"></script>
    <script src="/admin/admin.js?v=3"></script>
</body>
</html>
